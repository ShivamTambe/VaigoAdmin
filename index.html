<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAiGO ERP | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #03080e;
            --panel: #070f18;
            --card: #0d1c28;
            --card2: #0a1620;
            --border: #132333;
            --border2: #1a2f44;
            --accent: #00b8d4;
            --accent2: #0090a8;
            --green: #00e676;
            --orange: #ff8c00;
            --red: #ff3a4e;
            --text: #daeaf5;
            --muted: #3d6278;
            --mono: 'Share Tech Mono', monospace;
            --head: 'Rajdhani', sans-serif;
            --body: 'Exo 2', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: var(--body);
            color: var(--text);
            overflow: hidden;
            position: relative;
        }

        /* Background Effects */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 184, 212, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, var(--border) 1px, transparent 1px),
                linear-gradient(to bottom, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
            z-index: 0;
            pointer-events: none;
        }

        /* Container */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--border) inset;
        }

        /* Header */
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(0, 184, 212, 0.3));
        }

        .brand-name {
            font-family: var(--mono);
            font-size: 24px;
            color: var(--accent);
            letter-spacing: 2px;
            line-height: 1.2;
            font-weight: 700;
        }

        .brand-sub {
            font-family: var(--head);
            font-size: 13px;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-family: var(--mono);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 4px;
            font-family: var(--body);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--card2);
            box-shadow: 0 0 0 3px rgba(0, 184, 212, 0.1);
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        /* Action */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--accent2);
            border-color: var(--accent2);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 184, 212, 0.3);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        /* Extras */
        .extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 12px;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
        }

        .checkbox-wrap:hover {
            color: var(--text);
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-family: var(--head);
            transition: opacity 0.2s;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* System Status */
        .system-status {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--green);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>
    <div class="bg-glow"></div>

    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-icon">🚁</div>
            <div class="brand-name">VAiGO ERP</div>
            <div class="brand-sub">MEGHDEV CENTER MANAGEMENT PLATFORM</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">Admin ID</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your Admin ID" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Access Key</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required
                    autocomplete="current-password">
            </div>

            <div id="loginError"
                style="color: var(--red); font-size: 13px; margin-bottom: 15px; display: none; text-align: center; font-weight: 600;">
            </div>

            <div class="extras">
                <label class="checkbox-wrap">
                    <input type="checkbox" checked>
                    <span>Remember Device</span>
                </label>
                <a href="#" class="forgot-link">Forgot Key?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Initialize Session</button>
        </form>
    </div>

    <div class="system-status">
        <span class="status-dot"></span> VAIGO CORE V5.1 ONLINE & SECURE
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            btn.textContent = 'Authenticating...';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                // Call our secure Vercel Serverless Function
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Save the token so the dashboard knows we are authenticated
                    localStorage.setItem('vaigo_admin_token', data.token);

                    btn.textContent = 'Access Granted!';
                    btn.style.background = 'var(--green)';
                    btn.style.borderColor = 'var(--green)';
                    btn.style.color = '#000';

                    // Redirect to the dashboard
                    setTimeout(() => {
                        window.location.href = 'vaigo_erp_v5 (2).html';
                    }, 800);
                } else {
                    // Trigger the catch block with the proper message from the sever
                    throw new Error(data.message || 'Invalid Admin ID or Access Key');
                }
            } catch (error) {
                // Show error if invalid login
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                btn.textContent = 'Initialize Session';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
